services:
  app:
    build: .
    init: true
    ports:
      - "${APP_PORT:-5123}:5000"
    environment:
      DATABASE_URL: file:/app/server/data/prod.db
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in .env before starting}"
      PORT: "5000"
      NODE_ENV: production
      WEB_ORIGIN: "${WEB_ORIGIN:-}"
      MEALIE_URL: "${MEALIE_URL:-}"
      MEALIE_API_TOKEN: "${MEALIE_API_TOKEN:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_VISION_MODEL: "${OPENAI_VISION_MODEL:-gpt-4o-mini}"
    volumes:
      - "${DATA_DIR:-./data}:/app/server/data"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
